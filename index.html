<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover, maximum-scale=1.0">
  <title>电子螃蟹 · 蓝牙控制台</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    :root {
      --bg: #0b3a4a;
      --card: #11556b;
      --accent: #f7b731;
      --coral: #ff6b6b;
      --text: #f0f9fa;
      --text2: #b0d4dd;
      --border: #1e7a8f;
      --shadow: 0 8px 24px rgba(0,0,0,0.3);
    }
    * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: 'Inter', sans-serif;
      background: radial-gradient(circle at 30% 20%, #0a4b5c, #021c24);
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: 12px;
    }
    .phone {
      max-width: 420px; width: 100%; background: var(--bg); border-radius: 44px;
      padding: 16px 14px 24px; box-shadow: 0 20px 45px rgba(0,0,0,0.7), inset 0 0 0 1px rgba(255,255,255,0.1);
      border: 1px solid #1e6f82; color: var(--text);
      display: flex; flex-direction: column; gap: 14px;
    }
    .status-bar {
      display: flex; justify-content: space-between; align-items: center;
      background: #0e4d5e; border-radius: 28px; padding: 8px 16px; font-size:0.8rem; font-weight:600;
      border:1px solid #1e7a8f;
    }
    .bt-area { display:flex; align-items:center; gap:6px; }
    .led { width:10px; height:10px; border-radius:50%; background:#5a8a9a; transition:0.3s; }
    .led.active { background:#2ecc71; box-shadow:0 0 12px #2ecc71; animation:pulse 1.5s infinite; }
    @keyframes pulse { 0%,100%{opacity:0.6;transform:scale(1);} 50%{opacity:1;transform:scale(1.15);} }
    .clock { font-family:monospace; font-weight:700; color:#d4f0f5; }
    .btn {
      background: #136377; border: none; padding: 6px 14px; border-radius: 20px;
      font-weight:600; font-size:0.68rem; color:#fff; cursor:pointer; display:inline-flex;
      align-items:center; gap:4px; border:1px solid #1f8ca3; transition:0.15s; white-space:nowrap;
    }
    .btn:active { transform:scale(0.95); background:#1f8ca3; }
    .btn-accent { background:#f39c12; border-color:#f7b731; color:#0b2e38; }
    .btn-danger { background:#c0392b; border-color:#e74c3c; }
    .btn-warn { background:#d35400; border-color:#e67e22; }
    .btn-music { background:#8e44ad; border-color:#9b59b6; }
    .config-panel {
      display:none; background:#0e4d5e; border-radius:18px; padding:10px; flex-direction:column; gap:7px;
      border:1px solid #1e7a8f;
    }
    .config-panel input {
      background:#082b35; border:1px solid #1e7a8f; color:#fff; padding:6px 10px;
      border-radius:14px; font-family:monospace; font-size:0.65rem; flex:1; outline:none;
    }
    .row { display:flex; gap:6px; flex-wrap:wrap; align-items:center; }

    .crab-stage {
      display: flex; flex-direction: column; align-items: center;
      background: linear-gradient(180deg, #0a4150 0%, #05232c 100%);
      border-radius: 28px; padding: 12px; border:2px solid #1f8ca3;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .crab-svg-container {
      width: 100%; max-width: 280px; margin: 0 auto;
    }
    .crab-svg-container svg { width:100%; height:auto; }

    .music-panel {
      background: var(--card); border-radius: 20px; padding: 12px;
      border:1px solid var(--border);
    }
    .music-now {
      display: flex; align-items: center; gap: 10px;
      font-weight:600; font-size:0.8rem;
    }
    .music-progress {
      height:4px; background:#1e5a6b; border-radius:4px; margin:8px 0; overflow:hidden;
    }
    .music-progress div { height:100%; width:0%; background:#f7b731; border-radius:4px; transition: width 0.3s; }
    .music-btns { display:flex; flex-wrap:wrap; gap:6px; }

    .action-grid {
      display: grid; grid-template-columns: repeat(2,1fr); gap:8px;
    }
    .action-btn {
      background: #0e4d5e; border:1px solid #1f8ca3; border-radius:18px; padding:12px 8px;
      text-align:center; font-weight:700; font-size:0.7rem; color:#fff; cursor:pointer;
      transition:0.15s; display:flex; flex-direction:column; align-items:center; gap:4px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
    }
    .action-btn:active { background:#1f8ca3; transform:scale(0.96); }
    .action-btn .cmd { font-size:1.2rem; color:#f7b731; font-weight:800; }

    .log-box {
      background:#02161d; border-radius:16px; padding:8px 10px; height:80px; overflow-y:auto;
      font-family:monospace; font-size:0.6rem; color:#8cb8c4; border:1px solid #1e5a6b;
    }
  </style>
</head>
<body>
<div class="phone">
  <div class="status-bar">
    <div class="bt-area">
      <div class="led" id="bleLed"></div>
      <span id="connStatus">未连接</span>
      <button class="btn" id="configToggleBtn"><i class="fas fa-cog"></i></button>
    </div>
    <div class="clock" id="liveClock">--:--:--</div>
  </div>

  <div class="config-panel" id="configPanel">
    <div class="row">
      <input id="serviceUuid" value="0000fff0-0000-1000-8000-00805f9b34fb" placeholder="服务UUID">
      <input id="notifyUuid" value="0000fff1-0000-1000-8000-00805f9b34fb" placeholder="通知UUID">
      <input id="writeUuid" value="0000fff1-0000-1000-8000-00805f9b34fb" placeholder="写入UUID">
    </div>
    <div class="row">
      <button class="btn" id="scanBtn"><i class="fas fa-search"></i> 扫描</button>
      <button class="btn" id="connectBtn" disabled>连接</button>
      <button class="btn btn-danger" id="disconnectBtn" disabled>断开</button>
    </div>
  </div>

  <!-- 螃蟹3D模拟区 -->
  <div class="crab-stage">
    <div class="crab-svg-container" id="crabSvgContainer">
      <!-- SVG 螃蟹，后续通过JS动态创建 -->
    </div>
    <div style="text-align:center; font-weight:700; font-size:0.7rem; margin-top:4px;" id="crabStateLabel">待机 🦀</div>
  </div>

  <!-- 音乐播放面板 -->
  <div class="music-panel">
    <div class="music-now">
      <i class="fas fa-music" style="color:#f7b731;"></i>
      <span id="currentSong">未播放</span>
    </div>
    <div class="music-progress"><div id="musicProgressFill" style="width:0%;"></div></div>
    <div class="music-btns">
      <button class="btn btn-music" data-cmd="A">🎵 小鬼 (A)</button>
      <button class="btn btn-music" data-cmd="B">🎶 故意没接 (B)</button>
      <button class="btn btn-music" data-cmd="C">🎼 不将就 (C)</button>
      <button class="btn btn-music" data-cmd="D">🎤 CAPPER (D)</button>
      <button class="btn btn-danger" data-cmd="F">⏹️ 停止 (F)</button>
    </div>
  </div>

  <!-- 动作控制区 -->
  <div class="section-title" style="color:#f7b731; font-weight:700; font-size:0.8rem;">🤖 动作指令</div>
  <div class="action-grid">
    <div class="action-btn" data-cmd="E">
      <span class="cmd">E</span> 蹲下/站起
    </div>
    <div class="action-btn" data-cmd="K">
      <span class="cmd">K</span> 胳膊1 抬/放
    </div>
    <div class="action-btn" data-cmd="H">
      <span class="cmd">H</span> 胳膊2 抬/放
    </div>
    <div class="action-btn" data-cmd="I">
      <span class="cmd">I</span> 钳子1 抓/松
    </div>
    <div class="action-btn" data-cmd="G">
      <span class="cmd">G</span> 钳子2 抓/松
    </div>
  </div>

  <div class="log-box" id="logBox">🦀 电子螃蟹控制台就绪</div>
</div>

<script>
  (function() {
    // DOM 元素
    const bleLed = document.getElementById('bleLed');
    const connStatus = document.getElementById('connStatus');
    const configToggleBtn = document.getElementById('configToggleBtn');
    const configPanel = document.getElementById('configPanel');
    const scanBtn = document.getElementById('scanBtn');
    const connectBtn = document.getElementById('connectBtn');
    const disconnectBtn = document.getElementById('disconnectBtn');
    const serviceUuidInput = document.getElementById('serviceUuid');
    const notifyUuidInput = document.getElementById('notifyUuid');
    const writeUuidInput = document.getElementById('writeUuid');
    const logBox = document.getElementById('logBox');
    const clockSpan = document.getElementById('liveClock');
    const crabSvgContainer = document.getElementById('crabSvgContainer');
    const crabStateLabel = document.getElementById('crabStateLabel');
    const currentSongSpan = document.getElementById('currentSong');
    const musicProgressFill = document.getElementById('musicProgressFill');

    // 蓝牙变量
    let bluetoothDevice = null, gattServer = null, notifyChar = null, writeChar = null, isConnected = false;

    // 螃蟹状态
    let crabState = {
      squat: false,      // 蹲下/站起
      arm1Up: false,     // 胳膊1 (左钳子) 抬起
      arm2Up: false,     // 胳膊2 (右钳子) 抬起
      claw1Grab: false,  // 钳子1 抓取
      claw2Grab: false   // 钳子2 抓取
    };

    // 音乐状态
    let currentMusic = null;
    let musicTimer = null;
    let musicProgress = 0;
    const songNames = { 'A': '小鬼', 'B': '故意没接', 'C': '不将就', 'D': 'CAPPER' };

    // 构建SVG螃蟹
    function buildCrabSVG() {
      const svgNS = 'http://www.w3.org/2000/svg';
      const svg = document.createElementNS(svgNS, 'svg');
      svg.setAttribute('viewBox', '0 0 200 160');
      svg.setAttribute('width', '100%');
      svg.setAttribute('height', 'auto');

      // 身体 (随蹲下缩放Y)
      const body = document.createElementNS(svgNS, 'ellipse');
      body.setAttribute('cx', '100');
      body.setAttribute('cy', '90');
      body.setAttribute('rx', '40');
      body.setAttribute('ry', '25');
      body.setAttribute('fill', '#e67e22');
      body.setAttribute('stroke', '#d35400');
      body.setAttribute('stroke-width', '2');
      body.setAttribute('id', 'crabBody');
      svg.appendChild(body);

      // 眼睛
      const eyeL = document.createElementNS(svgNS, 'circle');
      eyeL.setAttribute('cx', '85'); eyeL.setAttribute('cy', '75'); eyeL.setAttribute('r', '5');
      eyeL.setAttribute('fill', 'white'); eyeL.setAttribute('stroke', '#333');
      svg.appendChild(eyeL);
      const eyeR = document.createElementNS(svgNS, 'circle');
      eyeR.setAttribute('cx', '115'); eyeR.setAttribute('cy', '75'); eyeR.setAttribute('r', '5');
      eyeR.setAttribute('fill', 'white'); eyeR.setAttribute('stroke', '#333');
      svg.appendChild(eyeR);
      const pupilL = document.createElementNS(svgNS, 'circle');
      pupilL.setAttribute('cx', '85'); pupilL.setAttribute('cy', '75'); pupilL.setAttribute('r', '2');
      pupilL.setAttribute('fill', 'black');
      svg.appendChild(pupilL);
      const pupilR = document.createElementNS(svgNS, 'circle');
      pupilR.setAttribute('cx', '115'); pupilR.setAttribute('cy', '75'); pupilR.setAttribute('r', '2');
      pupilR.setAttribute('fill', 'black');
      svg.appendChild(pupilR);

      // 左大钳子 (胳膊1)
      const arm1Group = document.createElementNS(svgNS, 'g');
      arm1Group.setAttribute('id', 'arm1');
      const arm1Line = document.createElementNS(svgNS, 'line');
      arm1Line.setAttribute('x1', '60'); arm1Line.setAttribute('y1', '80');
      arm1Line.setAttribute('x2', '30'); arm1Line.setAttribute('y2', '50');
      arm1Line.setAttribute('stroke', '#d35400'); arm1Line.setAttribute('stroke-width', '8');
      arm1Line.setAttribute('stroke-linecap', 'round');
      arm1Group.appendChild(arm1Line);
      const claw1 = document.createElementNS(svgNS, 'g');
      claw1.setAttribute('id', 'claw1');
      const claw1Upper = document.createElementNS(svgNS, 'path');
      claw1Upper.setAttribute('d', 'M30,50 Q15,30 25,20 Q35,35 40,45');
      claw1Upper.setAttribute('fill', '#e67e22'); claw1Upper.setAttribute('stroke', '#a04000');
      claw1Group.appendChild(claw1Upper);
      const claw1Lower = document.createElementNS(svgNS, 'path');
      claw1Lower.setAttribute('d', 'M30,50 Q15,65 25,75 Q35,60 40,50');
      claw1Lower.setAttribute('fill', '#e67e22'); claw1Lower.setAttribute('stroke', '#a04000');
      claw1Group.appendChild(claw1Lower);
      svg.appendChild(arm1Group);

      // 右大钳子 (胳膊2)
      const arm2Group = document.createElementNS(svgNS, 'g');
      arm2Group.setAttribute('id', 'arm2');
      const arm2Line = document.createElementNS(svgNS, 'line');
      arm2Line.setAttribute('x1', '140'); arm2Line.setAttribute('y1', '80');
      arm2Line.setAttribute('x2', '170'); arm2Line.setAttribute('y2', '50');
      arm2Line.setAttribute('stroke', '#d35400'); arm2Line.setAttribute('stroke-width', '8');
      arm2Line.setAttribute('stroke-linecap', 'round');
      arm2Group.appendChild(arm2Line);
      const claw2 = document.createElementNS(svgNS, 'g');
      claw2.setAttribute('id', 'claw2');
      const claw2Upper = document.createElementNS(svgNS, 'path');
      claw2Upper.setAttribute('d', 'M170,50 Q185,30 175,20 Q165,35 160,45');
      claw2Upper.setAttribute('fill', '#e67e22'); claw2Upper.setAttribute('stroke', '#a04000');
      claw2Group.appendChild(claw2Upper);
      const claw2Lower = document.createElementNS(svgNS, 'path');
      claw2Lower.setAttribute('d', 'M170,50 Q185,65 175,75 Q165,60 160,50');
      claw2Lower.setAttribute('fill', '#e67e22'); claw2Lower.setAttribute('stroke', '#a04000');
      claw2Group.appendChild(claw2Lower);
      svg.appendChild(arm2Group);

      // 腿
      for (let i = -1; i <= 1; i+=2) {
        for (let j = 0; j < 3; j++) {
          const leg = document.createElementNS(svgNS, 'line');
          leg.setAttribute('x1', i === -1 ? 65 : 135);
          leg.setAttribute('y1', 90 + j*8);
          leg.setAttribute('x2', i === -1 ? 20 + j*10 : 180 - j*10);
          leg.setAttribute('y2', 110 + j*12);
          leg.setAttribute('stroke', '#b85e0c'); leg.setAttribute('stroke-width', '4');
          leg.setAttribute('stroke-linecap', 'round');
          svg.appendChild(leg);
        }
      }

      crabSvgContainer.innerHTML = '';
      crabSvgContainer.appendChild(svg);
    }

    // 更新SVG螃蟹动作
    function updateCrabPose() {
      const body = document.getElementById('crabBody');
      const arm1 = document.getElementById('arm1');
      const arm2 = document.getElementById('arm2');
      const claw1 = document.getElementById('claw1');
      const claw2 = document.getElementById('claw2');
      if (!body) return;

      // 蹲下/站起 (缩放身体Y)
      body.setAttribute('ry', crabState.squat ? '18' : '25');
      body.setAttribute('cy', crabState.squat ? '95' : '90');

      // 胳膊抬起：旋转arm组
      if (arm1) {
        arm1.setAttribute('transform', crabState.arm1Up ? 'rotate(-30, 60, 80)' : 'rotate(0, 60, 80)');
      }
      if (arm2) {
        arm2.setAttribute('transform', crabState.arm2Up ? 'rotate(30, 140, 80)' : 'rotate(0, 140, 80)');
      }

      // 钳子抓取：缩放钳子路径 (通过调整d属性困难，简单变换)
      if (claw1) {
        claw1.setAttribute('transform', crabState.claw1Grab ? 'scale(0.7) translate(10, 15)' : 'scale(1) translate(0,0)');
      }
      if (claw2) {
        claw2.setAttribute('transform', crabState.claw2Grab ? 'scale(0.7) translate(-10, 15)' : 'scale(1) translate(0,0)');
      }

      // 更新状态文字
      const states = [];
      if (crabState.squat) states.push('蹲下');
      else states.push('站立');
      if (crabState.arm1Up) states.push('左臂抬');
      if (crabState.arm2Up) states.push('右臂抬');
      if (crabState.claw1Grab) states.push('左钳抓');
      if (crabState.claw2Grab) states.push('右钳抓');
      crabStateLabel.textContent = states.join(' · ') || '待机';
    }

    // 音乐播放模拟
    function startMusic(song) {
      stopMusic();
      currentMusic = song;
      currentSongSpan.textContent = songNames[song] || song;
      musicProgress = 0;
      musicProgressFill.style.width = '0%';
      musicTimer = setInterval(() => {
        musicProgress += 2;
        if (musicProgress >= 100) {
          musicProgress = 100;
          stopMusic();
        }
        musicProgressFill.style.width = musicProgress + '%';
      }, 200);
      addLog('🎵 播放: ' + (songNames[song] || song), 'system');
    }

    function stopMusic() {
      if (musicTimer) clearInterval(musicTimer);
      musicTimer = null;
      currentMusic = null;
      musicProgress = 0;
      musicProgressFill.style.width = '0%';
      currentSongSpan.textContent = '未播放';
    }

    // 发送指令
    async function sendCommand(cmd, desc) {
      if (!isConnected || !writeChar) {
        addLog('⚠️ 未连接，无法发送指令', 'tx');
        return;
      }
      try {
        await writeChar.writeValue(new TextEncoder().encode(cmd));
        addLog(`📤 下发: ${cmd} (${desc})`, 'tx');
        // 更新本地状态模拟
        handleLocalAction(cmd);
      } catch(e) {
        addLog(`发送失败: ${e.message}`, 'tx');
      }
    }

    function handleLocalAction(cmd) {
      switch(cmd) {
        case 'E': crabState.squat = !crabState.squat; break;
        case 'K': crabState.arm1Up = !crabState.arm1Up; break;
        case 'H': crabState.arm2Up = !crabState.arm2Up; break;
        case 'I': crabState.claw1Grab = !crabState.claw1Grab; break;
        case 'G': crabState.claw2Grab = !crabState.claw2Grab; break;
        case 'A': startMusic('A'); break;
        case 'B': startMusic('B'); break;
        case 'C': startMusic('C'); break;
        case 'D': startMusic('D'); break;
        case 'F': stopMusic(); break;
        default: return;
      }
      updateCrabPose();
    }

    // 蓝牙连接逻辑
    async function scan() {
      if (!navigator.bluetooth) { alert('需要 Web Bluetooth'); return; }
      const svc = serviceUuidInput.value.trim(); if(!svc) return alert('输入服务UUID');
      try {
        const device = await navigator.bluetooth.requestDevice({
          filters: [{ services: [svc] }], optionalServices: [svc]
        });
        bluetoothDevice = device; connectBtn.disabled = false;
        addLog('已选择设备: ' + (device.name || device.id), 'system');
      } catch(e) { if(!e.message.includes('cancelled')) addLog('扫描错误: ' + e.message); }
    }
    async function connect() {
      if (!bluetoothDevice) return;
      const svc = serviceUuidInput.value.trim(), ntf = notifyUuidInput.value.trim(), wrt = writeUuidInput.value.trim();
      try {
        gattServer = await bluetoothDevice.gatt.connect();
        const service = await gattServer.getPrimaryService(svc);
        notifyChar = await service.getCharacteristic(ntf);
        await notifyChar.startNotifications();
        notifyChar.addEventListener('characteristicvaluechanged', (event) => {
          const val = event.target.value;
          if (val) {
            const text = new TextDecoder('utf-8').decode(val);
            addLog('📥 收到: ' + text, 'rx');
          }
        });
        if (wrt) { try { writeChar = await service.getCharacteristic(wrt); } catch(e) {} }
        updateConnectionUI(true);
        bluetoothDevice.addEventListener('gattserverdisconnected', onDisconnect);
        addLog('✅ 蓝牙已连接', 'system');
      } catch(e) { addLog('连接失败: ' + e.message); updateConnectionUI(false); }
    }
    function onDisconnect() {
      addLog('🔌 断开');
      if (notifyChar) notifyChar.removeEventListener('characteristicvaluechanged', () => {});
      notifyChar = writeChar = null;
      updateConnectionUI(false);
    }
    function disconnect() {
      if (bluetoothDevice?.gatt.connected) bluetoothDevice.gatt.disconnect(); else onDisconnect();
    }
    function updateConnectionUI(connected) {
      isConnected = connected;
      bleLed.classList.toggle('active', connected);
      connStatus.textContent = connected ? '已连接' : '未连接';
      connectBtn.disabled = connected || !bluetoothDevice;
      disconnectBtn.disabled = !connected;
      scanBtn.disabled = connected;
    }

    // 日志
    function addLog(msg, type='system') {
      const div = document.createElement('div');
      div.style.color = type==='rx'?'#2ecc71': type==='tx'?'#f7b731':'#8cb8c4';
      div.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
      logBox.appendChild(div); logBox.scrollTop = logBox.scrollHeight;
      if(logBox.children.length > 25) logBox.removeChild(logBox.children[0]);
    }
    function updateClock() {
      clockSpan.textContent = new Date().toLocaleTimeString('zh-CN', {hour12:false});
    }
    setInterval(updateClock, 1000); updateClock();

    // 事件绑定
    configToggleBtn.addEventListener('click', () => configPanel.style.display = configPanel.style.display === 'none' ? 'flex' : 'none');
    scanBtn.addEventListener('click', scan);
    connectBtn.addEventListener('click', connect);
    disconnectBtn.addEventListener('click', disconnect);

    // 所有按钮绑定
    document.querySelectorAll('[data-cmd]').forEach(btn => {
      btn.addEventListener('click', () => {
        const cmd = btn.dataset.cmd;
        const desc = btn.textContent.trim().replace(/\(.*\)/, '').replace(/^\S+\s/, '');
        sendCommand(cmd, desc);
      });
    });

    // 初始化
    buildCrabSVG();
    updateCrabPose();
    updateConnectionUI(false);
    addLog('🦀 电子螃蟹控制台已启动');
  })();
</script>
</body>
</html>
