<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <title>天然气智能监测系统 · 豪华仪表盘</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: radial-gradient(circle at 20% 10%, #0a1424, #01040c);
            min-height: 100vh;
            padding: 20px;
            color: #eaf2ff;
        }
        .dashboard { max-width: 1500px; margin:0 auto; }
        .header {
            background: rgba(10, 20, 40, 0.65);
            backdrop-filter: blur(15px);
            border-radius: 2.5rem;
            padding: 1.2rem 2rem;
            margin-bottom: 24px;
            border: 1px solid rgba(0, 212, 255, 0.2);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
        }
        .title-section h1 {
            font-size: 2rem;
            font-weight: 800;
            background: linear-gradient(135deg, #cbd5ff, #22d3ee);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .conn-panel {
            display: flex;
            align-items: center;
            gap: 12px;
            background: #0d1729;
            border-radius: 3rem;
            padding: 0.3rem 1.2rem;
        }
        .led { width: 14px; height: 14px; border-radius: 50%; background: #475569; transition:0.2s; }
        .led.active { background: #10b981; box-shadow: 0 0 12px #10b981; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0%{box-shadow:0 0 4px #10b981;} 50%{box-shadow:0 0 18px #22d3ee;} 100%{box-shadow:0 0 4px #10b981;} }
        .btn {
            background: #1e2a3e; border: none; padding: 8px 18px; border-radius: 2.5rem;
            font-weight: 600; font-size: 0.8rem; color: #eef5ff; cursor: pointer;
            transition: all 0.2s; display: inline-flex; align-items: center; gap: 6px;
            backdrop-filter: blur(4px);
        }
        .btn-primary { background: #2563eb; } .btn-primary:hover { background: #3b82f6; }
        .btn-danger { background: #b91c1c; } .btn-success { background: #047857; }
        .btn-warning { background: #c2410c; } .btn-outline { background: transparent; border: 1px solid #3b82f6; }
        .btn:disabled { opacity:0.5; pointer-events:none; }
        .card {
            background: rgba(14, 23, 40, 0.7);
            backdrop-filter: blur(12px);
            border-radius: 2rem;
            padding: 1.5rem;
            border: 1px solid rgba(59,130,246,0.25);
            margin-bottom: 20px;
        }
        .gauges-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 20px;
            margin-bottom: 24px;
        }
        .gauge-card {
            background: rgba(8, 18, 33, 0.8);
            backdrop-filter: blur(10px);
            border-radius: 2rem;
            padding: 1.2rem;
            text-align: center;
            border: 1px solid rgba(56, 189, 248, 0.3);
            transition: 0.3s;
        }
        .gauge-card:hover { border-color: #38bdf8; box-shadow: 0 0 20px rgba(56,189,248,0.2); }
        .gauge-circle {
            width: 140px;
            height: 140px;
            margin: 0 auto 10px;
            position: relative;
        }
        canvas.gauge-canvas { width: 100%; height: 100%; }
        .alarm-panel {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            align-items: center;
        }
        .alarm-badge {
            padding: 6px 18px;
            border-radius: 30px;
            font-weight: 700;
            font-size: 0.85rem;
        }
        .chart-container {
            background: rgba(2, 10, 22, 0.65);
            backdrop-filter: blur(8px);
            border-radius: 2rem;
            padding: 1rem;
            margin: 20px 0;
            border: 1px solid #1e3a5f;
        }
        .history-table-wrapper {
            max-height: 300px;
            overflow-y: auto;
            background: #020b18;
            border-radius: 1.2rem;
            padding: 0.5rem;
            font-size: 0.75rem;
        }
        table { width: 100%; border-collapse: collapse; color: #ccdfff; }
        th { text-align: left; padding: 10px 6px; border-bottom: 1px solid #2c4c6e; color: #9ab9f0; }
        td { padding: 6px; border-bottom: 1px solid #1f334b; }
        .log-box {
            background: #020617; border-radius: 1rem; padding: 0.8rem;
            font-family: monospace; font-size: 0.7rem; color: #9ab9f0;
            max-height: 140px; overflow-y: auto; margin-top: 10px;
        }
        input, select {
            background: #0f1a2b; border: 1px solid #2c4c6e; border-radius: 2rem;
            padding: 8px 15px; color: white; font-size: 0.8rem; outline: none;
        }
        .flex-row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
        .dual-y-legend { display: flex; gap: 20px; font-size: 0.7rem; }
        /* 引导弹窗样式 (共用) */
        .guide-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(12px);
            z-index: 10000;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', sans-serif;
        }
        .guide-card {
            background: #0f172a;
            border-radius: 2rem;
            padding: 2rem;
            max-width: 320px;
            text-align: center;
            border: 1px solid #38bdf8;
            box-shadow: 0 20px 35px -10px black;
        }
        .guide-card h2 { margin-bottom: 1rem; }
        .guide-card button {
            margin-top: 1.5rem;
            background: #2563eb;
            border: none;
            padding: 10px 20px;
            border-radius: 2rem;
            font-weight: bold;
            color: white;
        }
        .guide-card a { color: #facc15; }
    </style>
</head>
<body>

<!-- 动态引导层容器（由JS决定显示） -->
<div id="dynamicGuide" style="display: none;" class="guide-overlay">
    <div class="guide-card">
        <i id="guideIcon" class="fas fa-bluetooth" style="font-size: 3rem;"></i>
        <h2 id="guideTitle">提示</h2>
        <p id="guideMessage"></p>
        <button id="closeGuideBtn">我知道了</button>
    </div>
</div>

<div class="dashboard">
    <div class="header">
        <div class="title-section">
            <h1><i class="fas fa-fire"></i> 天然气安全监测站</h1>
            <p style="color:#8ba0c7; font-size:0.8rem;">蓝牙实时数据 · 分级报警 · 历史分析</p>
        </div>
        <div class="conn-panel">
            <div class="led" id="bleLed"></div>
            <span id="connText" style="font-weight:500;">未连接</span>
            <button class="btn btn-outline" id="enableAudioBtn"><i class="fas fa-volume-up"></i> 启用警报</button>
        </div>
    </div>

    <details style="margin-bottom: 16px;" id="bleConfigDetails">
        <summary style="background:#0f1a2b; padding:10px 20px; border-radius:2rem; cursor:pointer; font-weight:600;">
            <i class="fas fa-cog"></i> 蓝牙连接配置
        </summary>
        <div class="card" style="margin-top:12px;">
            <div class="flex-row">
                <input id="serviceUuid" placeholder="服务UUID" value="0000fff0-0000-1000-8000-00805f9b34fb" style="flex:2;">
                <input id="notifyUuid" placeholder="通知UUID" value="0000fff1-0000-1000-8000-00805f9b34fb" style="flex:2;">
                <input id="writeUuid" placeholder="写入UUID" value="0000fff1-0000-1000-8000-00805f9b34fb" style="flex:2;">
            </div>
            <div class="flex-row" style="margin-top:12px;">
                <button class="btn btn-primary" id="scanBtn"><i class="fas fa-search"></i> 扫描设备</button>
                <button class="btn btn-success" id="connectBtn" disabled><i class="fas fa-link"></i> 连接</button>
                <button class="btn btn-danger" id="disconnectBtn" disabled><i class="fas fa-unlink"></i> 断开</button>
            </div>
        </div>
    </details>

    <div class="gauges-row" id="gaugeContainer"></div>

    <div class="card">
        <div class="flex-row" style="justify-content: space-between; flex-wrap: wrap;">
            <div>
                <h3 style="margin-bottom:10px;"><i class="fas fa-sliders-h"></i> 报警阈值控制</h3>
                <div class="flex-row">
                    <span>一级阈值 <span id="th1Display" style="font-weight:700;">--</span></span>
                    <button class="btn btn-outline" id="th1UpBtn"><i class="fas fa-plus"></i> +</button>
                    <button class="btn btn-outline" id="th1DownBtn"><i class="fas fa-minus"></i> -</button>
                    <span style="margin-left:20px;">二级阈值 <span id="th2Display" style="font-weight:700;">--</span></span>
                    <button class="btn btn-outline" id="th2UpBtn"><i class="fas fa-plus"></i> +</button>
                    <button class="btn btn-outline" id="th2DownBtn"><i class="fas fa-minus"></i> -</button>
                </div>
            </div>
            <div class="alarm-panel">
                <span id="alarmStatusText" class="alarm-badge" style="background:#1e293b;">✓ 正常</span>
                <button class="btn btn-warning" id="manualAlarmBtn"><i class="fas fa-bell"></i> 手动报警 (5)</button>
                <button class="btn btn-danger" id="closeAlarmBtn"><i class="fas fa-bell-slash"></i> 关闭 (6)</button>
            </div>
        </div>
        <div class="log-box" id="alarmLog">[报警] 系统就绪</div>
    </div>

    <div class="chart-container">
        <div class="flex-row" style="justify-content: space-between; margin-bottom: 10px;">
            <h4><i class="fas fa-chart-line"></i> 实时趋势 (最近50点)</h4>
            <div class="dual-y-legend">
                <span style="color:#3b82f6;">■ 温度(℃)</span>
                <span style="color:#10b981;">■ 湿度(%)</span>
                <span style="color:#f97316;">■ 浓度(ppm)</span>
                <span style="color:#facc15;">--- 阈值</span>
            </div>
        </div>
        <canvas id="historyChart" style="width:100%; height:260px; background:#010a14; border-radius:1.2rem;"></canvas>
    </div>

    <div class="card">
        <div class="flex-row" style="justify-content: space-between; margin-bottom: 15px;">
            <h3><i class="fas fa-database"></i> 历史记录</h3>
            <div class="flex-row">
                <input type="datetime-local" id="startTime" style="color:white;">
                <span>至</span>
                <input type="datetime-local" id="endTime" style="color:white;">
                <button class="btn btn-primary" id="queryBtn"><i class="fas fa-filter"></i> 查询</button>
                <button class="btn btn-primary" id="exportCsvBtn"><i class="fas fa-file-csv"></i> 导出CSV</button>
                <button class="btn btn-warning" id="clearHistoryBtn"><i class="fas fa-trash"></i> 清空</button>
            </div>
        </div>
        <div class="history-table-wrapper" id="historyTableWrapper">
            <table id="historyTable">
                <thead><tr><th>时间</th><th>温度(℃)</th><th>湿度(%)</th><th>浓度(ppm)</th><th>一级阈值</th><th>二级阈值</th><th>状态</th></tr></thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>
    </div>

    <div class="log-box" id="systemLog" style="max-height:130px;">[系统] 等待蓝牙连接...</div>
</div>

<script>
    (function() {
        // ---------- 环境检测与引导 ----------
        const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
        const isAndroid = /Android/i.test(navigator.userAgent);
        const hasBluetooth = 'bluetooth' in navigator;

        function showGuide(title, message, iconClass = 'fa-bluetooth') {
            const guideDiv = document.getElementById('dynamicGuide');
            document.getElementById('guideTitle').innerText = title;
            document.getElementById('guideMessage').innerHTML = message;
            document.getElementById('guideIcon').className = `fas ${iconClass} fa-3x`;
            guideDiv.style.display = 'flex';
            document.getElementById('closeGuideBtn').onclick = () => {
                guideDiv.style.display = 'none';
            };
        }

        // 针对 iOS 不支持 Web Bluetooth 的引导（原有逻辑）
        if (isIOS && !hasBluetooth) {
            showGuide(
                '您的浏览器不支持蓝牙',
                'iOS 上的 Safari / 微信无法连接蓝牙。<br><br>请使用专用浏览器：<br>📱 <a href="https://apps.apple.com/app/bluefy-web-ble-browser/id1492822055" target="_blank" style="color:#facc15;">Bluefy (免费)</a>',
                'fa-bluetooth-b'
            );
            // 禁用所有蓝牙按钮
            const btns = document.querySelectorAll('.btn');
            btns.forEach(btn => { btn.disabled = true; });
            return; // 不再执行后续代码
        }

        // 针对安卓：如果浏览器不支持 Web Bluetooth（极少见）
        if (isAndroid && !hasBluetooth) {
            showGuide(
                '浏览器不支持 Web Bluetooth',
                '请使用最新版的 Chrome 浏览器，并确保 Android 系统版本 ≥ 6.0。<br><br>推荐安装 <a href="https://play.google.com/store/apps/details?id=com.android.chrome" target="_blank">Chrome</a> 后重试。',
                'fa-exclamation-triangle'
            );
            return;
        }

        // 对于支持 Web Bluetooth 的安卓，提示位置权限（可选，先不阻塞，但可以提醒）
        if (isAndroid && hasBluetooth) {
            // 可以稍后在扫描失败时提示，这里先静默
            console.log("Android + Web Bluetooth 支持良好，请确保已开启位置权限和蓝牙");
        }

        // ---------- 原有业务逻辑 ----------
        const bleLed = document.getElementById('bleLed');
        const connText = document.getElementById('connText');
        const scanBtn = document.getElementById('scanBtn');
        const connectBtn = document.getElementById('connectBtn');
        const disconnectBtn = document.getElementById('disconnectBtn');
        const enableAudioBtn = document.getElementById('enableAudioBtn');
        const th1Up = document.getElementById('th1UpBtn');
        const th1Down = document.getElementById('th1DownBtn');
        const th2Up = document.getElementById('th2UpBtn');
        const th2Down = document.getElementById('th2DownBtn');
        const manualAlarmBtn = document.getElementById('manualAlarmBtn');
        const closeAlarmBtn = document.getElementById('closeAlarmBtn');
        const queryBtn = document.getElementById('queryBtn');
        const exportCsvBtn = document.getElementById('exportCsvBtn');
        const clearHistoryBtn = document.getElementById('clearHistoryBtn');
        const startTimeInput = document.getElementById('startTime');
        const endTimeInput = document.getElementById('endTime');
        const tableBody = document.getElementById('tableBody');
        const systemLog = document.getElementById('systemLog');
        const alarmLog = document.getElementById('alarmLog');
        const historyChartCanvas = document.getElementById('historyChart');
        const ctx = historyChartCanvas.getContext('2d');

        const serviceUuidInput = document.getElementById('serviceUuid');
        const notifyUuidInput = document.getElementById('notifyUuid');
        const writeUuidInput = document.getElementById('writeUuid');

        let bluetoothDevice, gattServer, notifyChar, writeChar;
        let isConnected = false;
        let audioCtx = null, audioAllowed = false;

        let currentTemp = 0, currentHumidity = 0, currentGas = 0;
        let threshold1 = 0, threshold2 = 0;
        let alarmLevel = 0;

        const MAX_HISTORY = 100;
        let historyData = [];

        function addLog(el, msg) {
            const div = document.createElement('div');
            div.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
            el.appendChild(div); el.scrollTop = el.scrollHeight;
            if(el.children.length > 60) el.removeChild(el.children[0]);
        }
        const logSys = m => addLog(systemLog, m);
        const logAlarm = m => addLog(alarmLog, m);

        function enableAudio() {
            if(audioCtx) {
                if(audioCtx.state === 'suspended') audioCtx.resume().then(()=>{ audioAllowed=true; logSys('🔊 警报声音已激活'); });
            } else {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                audioCtx.resume().then(()=>{ audioAllowed=true; logSys('🔊 警报声音已启用'); });
            }
        }
        function playAlarm(type) {
            if(!audioAllowed || !audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.6);
            osc.frequency.value = (type === 'level2') ? 1200 : 750;
            osc.start(); osc.stop(audioCtx.currentTime + 0.5);
        }

        function parsePacket(packet) {
            const parts = packet.split('#').filter(p => p.trim() !== '');
            if(parts.length >= 5) {
                const t = parseFloat(parts[0]), h = parseFloat(parts[1]), g = parseFloat(parts[2]);
                const th1 = parseFloat(parts[3]), th2 = parseFloat(parts[4]);
                if(!isNaN(t) && !isNaN(h) && !isNaN(g) && !isNaN(th1) && !isNaN(th2)) {
                    currentTemp = t; currentHumidity = h; currentGas = g;
                    threshold1 = th1; threshold2 = th2;
                    updateDisplays();
                    checkAlarms();
                    addHistoryRecord();
                    drawChart();
                    return true;
                }
            }
            return false;
        }

        function updateDisplays() {
            document.getElementById('th1Display').textContent = threshold1.toFixed(1);
            document.getElementById('th2Display').textContent = threshold2.toFixed(1);
            drawGauges();
        }

        function checkAlarms() {
            const prevLevel = alarmLevel;
            if(currentGas >= threshold2) alarmLevel = 2;
            else if(currentGas >= threshold1) alarmLevel = 1;
            else alarmLevel = 0;

            if(alarmLevel !== prevLevel) {
                if(alarmLevel === 2) { logAlarm('🔴 二级报警！浓度超过二级阈值'); playAlarm('level2'); }
                else if(alarmLevel === 1) { logAlarm('🟠 一级报警！浓度超过一级阈值'); playAlarm('level1'); }
                else { logAlarm('✅ 浓度恢复正常'); }
            }
            const badge = document.getElementById('alarmStatusText');
            if(alarmLevel === 2) { badge.textContent = '🚨 二级报警'; badge.style.background='#b91c1c'; }
            else if(alarmLevel === 1) { badge.textContent = '⚠️ 一级报警'; badge.style.background='#c2410c'; }
            else { badge.textContent = '✓ 正常'; badge.style.background='#1e293b'; }
        }

        function addHistoryRecord() {
            historyData.push({
                time: new Date().toISOString(),
                temp: currentTemp, humidity: currentHumidity, gas: currentGas,
                th1: threshold1, th2: threshold2
            });
            if(historyData.length > MAX_HISTORY) historyData.shift();
            saveHistoryToStorage();
            renderHistoryTable();
        }

        function saveHistoryToStorage() {
            try { localStorage.setItem('gasHistory', JSON.stringify(historyData)); } catch(e) {}
        }
        function loadHistoryFromStorage() {
            try {
                const saved = localStorage.getItem('gasHistory');
                if(saved) historyData = JSON.parse(saved);
            } catch(e) { historyData = []; }
        }

        function renderHistoryTable(filteredData = null) {
            const data = filteredData || historyData;
            tableBody.innerHTML = '';
            data.slice().reverse().forEach(rec => {
                const date = new Date(rec.time);
                const timeStr = date.toLocaleString();
                let status = '正常';
                if(rec.gas >= rec.th2) status = '二级报警';
                else if(rec.gas >= rec.th1) status = '一级报警';
                const row = `<tr>
                    <td>${timeStr}</td><td>${rec.temp.toFixed(1)}</td><td>${rec.humidity.toFixed(1)}</td>
                    <td>${rec.gas.toFixed(1)}</td><td>${rec.th1.toFixed(1)}</td><td>${rec.th2.toFixed(1)}</td>
                    <td style="color:${status.includes('二级')?'#f87171':status.includes('一级')?'#fb923c':'#4ade80'}">${status}</td>
                </tr>`;
                tableBody.innerHTML += row;
            });
        }

        function exportCSV() {
            let csv = "时间,温度(℃),湿度(%),天然气浓度(ppm),一级阈值,二级阈值,状态\n";
            historyData.forEach(r => {
                const date = new Date(r.time).toLocaleString();
                let status = r.gas>=r.th2?'二级报警':(r.gas>=r.th1?'一级报警':'正常');
                csv += `"${date}",${r.temp},${r.humidity},${r.gas},${r.th1},${r.th2},${status}\n`;
            });
            const blob = new Blob(['\ufeff'+csv], {type:'text/csv;charset=utf-8;'});
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `天然气监测数据_${new Date().toISOString().slice(0,10)}.csv`;
            link.click();
            logSys('📁 CSV报表已导出');
        }

        function queryHistory() {
            const start = startTimeInput.value ? new Date(startTimeInput.value) : null;
            const end = endTimeInput.value ? new Date(endTimeInput.value) : null;
            if(!start && !end) { renderHistoryTable(); return; }
            const filtered = historyData.filter(r => {
                const t = new Date(r.time);
                if(start && t < start) return false;
                if(end && t > end) return false;
                return true;
            });
            renderHistoryTable(filtered);
            logSys(`🔍 查询到 ${filtered.length} 条记录`);
        }

        function drawChart() {
            const w = historyChartCanvas.clientWidth;
            const h = historyChartCanvas.clientHeight;
            historyChartCanvas.width = w; historyChartCanvas.height = h;
            ctx.clearRect(0,0,w,h);
            if(historyData.length < 2) {
                ctx.fillStyle = '#6c8fbb'; ctx.font = '14px Inter';
                ctx.fillText('等待数据...', w/2-40, h/2);
                return;
            }
            const n = historyData.length;
            const stepX = w / (n-1);
            const temps = historyData.map(d=>d.temp);
            const humids = historyData.map(d=>d.humidity);
            const gases = historyData.map(d=>d.gas);
            const leftMin = Math.min(...temps, ...humids, 0);
            const leftMax = Math.max(...temps, ...humids, 100);
            const rightMin = 0;
            const rightMax = Math.max(...gases, threshold2+20, 100);
            const mapYLeft = (v) => h-30-((v-leftMin)/(leftMax-leftMin||1))*(h-60);
            const mapYRight = (v) => h-30-((v-rightMin)/(rightMax-rightMin||1))*(h-60);
            ctx.strokeStyle = '#1e3550'; ctx.lineWidth = 0.5;
            for(let i=0;i<=4;i++) {
                let y = 30 + (i/4)*(h-60);
                ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(w,y); ctx.stroke();
            }
            ctx.beginPath(); ctx.strokeStyle = '#3b82f6'; ctx.lineWidth = 2;
            temps.forEach((v,i)=>{ let x=i*stepX, y=mapYLeft(v); i===0?ctx.moveTo(x,y):ctx.lineTo(x,y); }); ctx.stroke();
            ctx.beginPath(); ctx.strokeStyle = '#10b981'; ctx.lineWidth = 2;
            humids.forEach((v,i)=>{ let x=i*stepX, y=mapYLeft(v); i===0?ctx.moveTo(x,y):ctx.lineTo(x,y); }); ctx.stroke();
            ctx.beginPath(); ctx.strokeStyle = '#f97316'; ctx.lineWidth = 2.5;
            gases.forEach((v,i)=>{ let x=i*stepX, y=mapYRight(v); i===0?ctx.moveTo(x,y):ctx.lineTo(x,y); }); ctx.stroke();
            ctx.setLineDash([5,4]);
            ctx.beginPath(); ctx.strokeStyle = '#facc15'; ctx.lineWidth = 1.2;
            let yTh1 = mapYRight(threshold1); ctx.moveTo(0,yTh1); ctx.lineTo(w,yTh1); ctx.stroke();
            ctx.beginPath(); ctx.strokeStyle = '#ef4444'; ctx.lineWidth = 1.2;
            let yTh2 = mapYRight(threshold2); ctx.moveTo(0,yTh2); ctx.lineTo(w,yTh2); ctx.stroke();
            ctx.setLineDash([]);
            ctx.fillStyle = '#8ba0c7'; ctx.font = '10px Inter';
            ctx.fillText(`${leftMin.toFixed(0)}`, 5, h-35);
            ctx.fillText(`${leftMax.toFixed(0)}`, 5, 40);
            ctx.fillText(`${rightMin}`, w-30, h-35);
            ctx.fillText(`${rightMax.toFixed(0)}`, w-30, 40);
        }

        function drawGauges() {
            const container = document.getElementById('gaugeContainer');
            if(!container) return;
            container.innerHTML = '';
            const gauges = [
                { label:'温度 ℃', value:currentTemp, max:80, unit:'℃', color:'#3b82f6' },
                { label:'湿度 %', value:currentHumidity, max:100, unit:'%', color:'#10b981' },
                { label:'天然气浓度', value:currentGas, max:Math.max(threshold2*1.5, 200), unit:'ppm', color:'#f97316', danger:threshold2 }
            ];
            gauges.forEach(g => {
                const card = document.createElement('div');
                card.className = 'gauge-card';
                card.innerHTML = `
                    <div style="font-weight:600; margin-bottom:8px;">${g.label}</div>
                    <div class="gauge-circle"><canvas class="gauge-canvas" width="140" height="140"></canvas></div>
                    <div style="font-size:1.8rem; font-weight:800;">${g.value.toFixed(1)}<small>${g.unit}</small></div>
                `;
                container.appendChild(card);
                const canvas = card.querySelector('canvas');
                drawSingleGauge(canvas, g.value, g.max, g.color, g.danger);
            });
        }

        function drawSingleGauge(canvas, value, max, color, danger) {
            const ctx = canvas.getContext('2d');
            const w = canvas.width, h = canvas.height;
            ctx.clearRect(0,0,w,h);
            const centerX = w/2, centerY = h/2+10, radius = 50;
            const startAngle = Math.PI * 0.75;
            const endAngle = Math.PI * 2.25;
            ctx.beginPath(); ctx.arc(centerX, centerY, radius, startAngle, endAngle);
            ctx.strokeStyle = '#1e2a3a'; ctx.lineWidth = 14; ctx.stroke();
            const ratio = Math.min(value/max, 1);
            const currentAngle = startAngle + ratio * (endAngle - startAngle);
            ctx.beginPath(); ctx.arc(centerX, centerY, radius, startAngle, currentAngle);
            ctx.strokeStyle = (danger && value >= danger) ? '#ef4444' : color;
            ctx.lineWidth = 14; ctx.stroke();
            const needleAngle = currentAngle;
            const needleLength = radius - 15;
            const nx = centerX + Math.cos(needleAngle) * needleLength;
            const ny = centerY + Math.sin(needleAngle) * needleLength;
            ctx.beginPath(); ctx.moveTo(centerX, centerY); ctx.lineTo(nx, ny);
            ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 3; ctx.stroke();
            ctx.beginPath(); ctx.arc(centerX, centerY, 6, 0, 2*Math.PI); ctx.fillStyle = '#fff'; ctx.fill();
        }

        function handleNotification(event) {
            const value = event.target.value;
            if(!value) return;
            const text = new TextDecoder('utf-8').decode(value);
            logSys(`📩 数据: ${text}`);
            parsePacket(text);
        }

        async function sendCommand(cmd) {
            if(!writeChar || !isConnected) { logSys('⚠️ 未连接，无法发送'); return; }
            try {
                await writeChar.writeValue(new TextEncoder().encode(cmd));
                logSys(`📤 已发送: ${cmd}`);
            } catch(e) { logSys(`❌ 发送失败: ${e.message}`); }
        }

        async function scanDevice() {
            if(!navigator.bluetooth) {
                if(isAndroid) {
                    showGuide('浏览器不支持 Web Bluetooth', '请使用 Chrome 浏览器，并确保 Android 版本 ≥ 6.0。<br>同时检查是否已开启“位置权限”。', 'fa-exclamation-triangle');
                } else {
                    alert('当前浏览器不支持 Web Bluetooth，请使用 Chrome 或 Edge 并确保 HTTPS 环境');
                }
                return;
            }
            const uuid = serviceUuidInput.value.trim();
            if(!uuid) return alert('请填写服务 UUID');
            try {
                const device = await navigator.bluetooth.requestDevice({
                    filters:[{services:[uuid]}],
                    optionalServices:[uuid]
                });
                bluetoothDevice = device;
                connectBtn.disabled = false;
                logSys(`已选择设备: ${device.name || device.id}`);
            } catch(e) {
                if(e.message.includes('User cancelled')) return;
                logSys(`扫描错误: ${e.message}`);
                // 如果错误包含“location”，提示用户开启位置权限
                if(e.message.toLowerCase().includes('location')) {
                    showGuide('需要位置权限', 'Android 系统要求开启“位置信息”权限才能扫描蓝牙设备。<br><br>请前往 设置 → 应用 → Chrome → 权限 → 位置信息 → 允许。', 'fa-location-dot');
                }
            }
        }

        async function connectDevice() {
            if(!bluetoothDevice) return;
            const svc = serviceUuidInput.value.trim();
            const ntf = notifyUuidInput.value.trim();
            const wrt = writeUuidInput.value.trim();
            try {
                gattServer = await bluetoothDevice.gatt.connect();
                const service = await gattServer.getPrimaryService(svc);
                notifyChar = await service.getCharacteristic(ntf);
                await notifyChar.startNotifications();
                notifyChar.addEventListener('characteristicvaluechanged', handleNotification);
                if(wrt) { try { writeChar = await service.getCharacteristic(wrt); } catch(e){} }
                updateConnectionUI(true);
                bluetoothDevice.addEventListener('gattserverdisconnected', onDisconnect);
                logSys('✅ 连接成功');
            } catch(e) {
                logSys(`连接失败: ${e.message}`);
                updateConnectionUI(false);
            }
        }

        function onDisconnect() {
            logSys('设备断开');
            updateConnectionUI(false);
            if(notifyChar) notifyChar.removeEventListener('characteristicvaluechanged', handleNotification);
            notifyChar = null; writeChar = null;
        }

        function updateConnectionUI(connected) {
            isConnected = connected;
            bleLed.classList.toggle('active', connected);
            connText.textContent = connected ? '已连接' : '未连接';
            connectBtn.disabled = connected || !bluetoothDevice;
            disconnectBtn.disabled = !connected;
            scanBtn.disabled = connected;
        }

        scanBtn.addEventListener('click', scanDevice);
        connectBtn.addEventListener('click', connectDevice);
        disconnectBtn.addEventListener('click', ()=>{
            if(bluetoothDevice?.gatt.connected) bluetoothDevice.gatt.disconnect();
        });
        enableAudioBtn.addEventListener('click', enableAudio);
        th1Up.addEventListener('click', ()=> sendCommand('1'));
        th1Down.addEventListener('click', ()=> sendCommand('2'));
        th2Up.addEventListener('click', ()=> sendCommand('3'));
        th2Down.addEventListener('click', ()=> sendCommand('4'));
        manualAlarmBtn.addEventListener('click', ()=>{ sendCommand('5'); logAlarm('🔔 手动报警已触发'); });
        closeAlarmBtn.addEventListener('click', ()=>{ sendCommand('6'); logAlarm('🔕 报警关闭指令已发送'); });
        queryBtn.addEventListener('click', queryHistory);
        exportCsvBtn.addEventListener('click', exportCSV);
        clearHistoryBtn.addEventListener('click', ()=>{
            historyData = []; saveHistoryToStorage(); renderHistoryTable(); drawChart();
            logSys('历史记录已清空');
        });

        loadHistoryFromStorage();
        renderHistoryTable();
        updateDisplays();
        drawChart();
        updateConnectionUI(false);
        logSys('🚀 天然气监测系统启动，请连接蓝牙设备');
        setInterval(drawChart, 2000);
    })();
</script>
